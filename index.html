<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ahorcado - Metodologías Ágiles</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Juego del Ahorcado</h1>
      </header>
      <main>
        <section id="game-container">
          <div id="palabra-oculta" class="palabra-display"></div>
          <div id="intentos-info" class="intentos-display">
            Intentos restantes: <span id="intentos-restantes">6</span>
          </div>
          <div id="letras-arriesgadas-info" class="letras-arriesgadas-display">
            Letras arriesgadas: <span id="letras-arriesgadas"></span>
          </div>
          <div id="estado-juego" class="estado-display"></div>
          <form id="formulario-letra">
            <label for="letra">Letra</label>
            <input id="letra" name="letra" type="text" />
            <button type="submit">Arriesgar</button>
          </form>
          <button id="btn-reiniciar" type="button" hidden>Jugar de nuevo</button>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
